name: Build & Push NodeWarden image

on:
  push:
    branches: [main]
  schedule:
    # 每小时检测一次上游；上游没变就跳过构建（几乎零成本）
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略比对，强制构建"
        type: boolean
        default: false

# contents:write -> 提交 last-built.sha 回本仓库
# packages:write -> 推镜像到 GHCR
permissions:
  contents: write
  packages: write

concurrency:
  group: nodewarden-build
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/fellban/nodewarden
  # 自建 fork：FellBan/FlexVault（源自 lj5645/FlexVault，自带原生 Node.js 自托管，无需 Miniflare / Cloudflare）
  # 跟踪我们自己的 fork，不再依赖第三方维护者是否同步上游。
  UPSTREAM: https://github.com/FellBan/FlexVault.git
  # 官方上游：仅用于 staleness 检测（官方领先我们的 fork 时告警）
  NODEWARDEN_UPSTREAM: https://github.com/shuaiplus/nodewarden.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 本仓库（含 Dockerfile 与 last-built.sha）
        uses: actions/checkout@v4

      - name: 获取上游最新 commit
        id: upstream
        run: |
          SHA=$(git ls-remote "$UPSTREAM" HEAD | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "上游最新 commit: $SHA"

      - name: 读取上次已构建的 commit
        id: last
        run: |
          if [ -f last-built.sha ]; then
            echo "sha=$(cat last-built.sha)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=none" >> "$GITHUB_OUTPUT"
          fi

      - name: 上游 staleness 检测（官方 nodewarden 是否领先我们的 fork）
        id: stale
        run: |
          NW_SHA=$(git ls-remote "$NODEWARDEN_UPSTREAM" HEAD | awk '{print $1}')
          echo "nodewarden_sha=$NW_SHA" >> "$GITHUB_OUTPUT"
          if [ -f nodewarden-ref.sha ]; then
            REF=$(cat nodewarden-ref.sha)
          else
            REF=none
          fi
          echo "记录基准: $REF"
          echo "官方最新: $NW_SHA"
          if [ "$REF" = "none" ] || [ "$REF" != "$NW_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            MSG="⚠️ 上游 shuaiplus/nodewarden 已领先我们 fork 所基于的版本（基准 $REF vs 最新 $NW_SHA）。恢复方法：把 nodewarden 合并进 FellBan/FlexVault，再把 nodewarden-ref.sha 更新为合并后的 nodewarden SHA 并提交。"
            echo "$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "✅ 我们的 fork 已基于最新官方 nodewarden（$NW_SHA）"
            echo "✅ 我们的 fork 已基于最新官方 nodewarden（$NW_SHA）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 判断是否需要构建
        id: decide
        run: |
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "强制构建"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.upstream.outputs.sha }}" = "${{ steps.last.outputs.sha }}" ]; then
            echo "上游无变化（${{ steps.upstream.outputs.sha }}），跳过构建"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "上游有变化（last=${{ steps.last.outputs.sha }} -> new=${{ steps.upstream.outputs.sha }}），开始构建"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU（用于构建 arm64 等非原生架构）
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 克隆上游最新代码并注入 Dockerfile
        if: steps.decide.outputs.build == 'true'
        run: |
          git clone --depth 1 "$UPSTREAM" src
          cp Dockerfile docker-entrypoint.sh .dockerignore src/

      - name: 构建并推送镜像到 GHCR
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: src
          push: true
          # 同时构建 amd64 与 arm64，覆盖 x86 服务器与 ARM 设备（如树莓派）
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.upstream.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 记录本次构建 commit 并提交回仓库
        if: steps.decide.outputs.build == 'true'
        run: |
          echo "${{ steps.upstream.outputs.sha }}" > last-built.sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-built.sha
          if git diff --cached --quiet; then
            echo "last-built.sha 无变化（该 commit 之前已构建过），跳过提交"
          else
            git commit -m "chore: built FlexVault (nodewarden) at ${{ steps.upstream.outputs.sha }}"
            git push
          fi
